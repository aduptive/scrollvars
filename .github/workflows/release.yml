# Publishing happens HERE, never from a laptop: push a version tag and the
# release only reaches npm if every gate is green. Requires the NPM_TOKEN
# secret (repo Settings → Secrets → Actions): until it exists, the publish
# step fails safely and nothing ships.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm test                    # pretest builds, then the unit suite
      - run: npm run test:packed-unit    # its own step: npm pack rebuilds dist, would race npm test's parallel files
      - run: npm run demo:sync
      - name: generated docs and pages are committed, not hand-patched
        run: git diff --exit-code -- README.md AGENTS.md demo/llms.txt demo/bench/index.html demo/bench/scrollvars.html demo/fx demo/docs styles.css src/compat/index.ts demo/index.html docs/integration.md docs/guide.md demo/bench/scoped.css skills/scrollvars/SKILL.md
      - run: npm run test:e2e            # progressive-enhancement invariants
        env: { CHROME: /usr/bin/google-chrome }
      - run: npx --prefix demo/bench/harness playwright install --with-deps chromium firefox webkit
      - run: npm run test:browsers
      - name: CHANGELOG has an entry for this version
        run: grep -q "^## $(node -p "require('./package.json').version") " CHANGELOG.md
      - name: tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package.json $PKG"; exit 1; }
      - name: 'pack smoke: the tarball actually installs and imports'
        id: pack
        run: |
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/scrollvars-pack.json"
          # this runner's npm prints the prepare script's stdout in front of the
          # JSON: the harness's packJson skips it, one parser for both jobs
          TARBALL=$(node --input-type=module -e 'import fs from "node:fs"; import { packJson } from "./demo/bench/harness/packed-acceptance.mjs"; process.stdout.write(packJson(fs.readFileSync(process.argv[1], "utf8"))[0].filename)' "$RUNNER_TEMP/scrollvars-pack.json")
          TARBALL="$RUNNER_TEMP/$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm i "$TARBALL"
          node --input-type=module -e "import * as sv from 'scrollvars'; import * as c from 'scrollvars/canvas'; if (typeof sv.track !== 'function' || typeof c.mountEffect !== 'function') process.exit(1); console.log('consumer import ok (ESM)')"
      - name: packed tarball ships the skill, and its version matches package.json
        run: |
          SKILL="/tmp/consumer/node_modules/scrollvars/skills/scrollvars/SKILL.md"
          [ -f "$SKILL" ] || { echo "packed tarball has no skills/scrollvars/SKILL.md"; exit 1; }
          PKG=$(node -p "require('./package.json').version")
          grep -q "version: \"$PKG\"" "$SKILL" || { echo "packed skill's metadata.version does not match package.json $PKG"; exit 1; }
      - name: packed acceptance in Chromium, Firefox and WebKit
        run: npm run test:packed
        env:
          SCROLLVARS_TARBALL: ${{ steps.pack.outputs.tarball }}
          SCROLLVARS_ACCEPTANCE_DIR: ${{ runner.temp }}/packed-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-acceptance-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packed-acceptance
          if-no-files-found: warn
      - name: publish to npm (with provenance)
        run: npm publish "$SCROLLVARS_TARBALL" --provenance --access public
        env:
          SCROLLVARS_TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
