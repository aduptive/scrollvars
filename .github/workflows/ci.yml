name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test          # pretest builds the dist first

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run demo:sync
      - name: generated docs and pages are committed, not hand-patched
        run: git diff --exit-code -- README.md AGENTS.md demo/llms.txt demo/bench/index.html demo/fx demo/docs styles.css
      - run: npm run test:e2e
        env:
          CHROME: /usr/bin/google-chrome
