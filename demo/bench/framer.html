<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>bench · framer-motion</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #121118; color: #e6e4f0; font: 14px/1.5 -apple-system, sans-serif; }
  .hud { position: fixed; top: 12px; left: 12px; z-index: 9; background: rgba(0,0,0,.75);
         padding: 14px 18px; border-radius: 10px; font-family: ui-monospace, monospace;
         font-size: 13px; white-space: pre; }
  section { position: relative; height: 120vh; overflow: hidden;
            border-top: 1px solid rgba(255,255,255,.06); }
  .box { position: absolute; width: 90px; height: 90px; border-radius: 12px;
         will-change: transform, opacity; }
</style>
</head><body>
<div id="root"></div>
<script src="runner.js"></script>
<script type="module">
  import React from 'https://esm.sh/react@18.3.1';
  import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
  import { motion, useScroll, useTransform } from 'https://esm.sh/framer-motion@11.18.2?deps=react@18.3.1';

  var Q = new URLSearchParams(location.search);
  var SECTIONS = +Q.get('s') || 30, PER = +Q.get('p') || 5;
  var COLORS = ['#a78bfa', '#ffb454', '#6ee7a0', '#7dd3fc', '#ff7d90'];
  function seeded(i) { return (Math.sin(i * 999) + 1) / 2; }
  var h = React.createElement;

  function Box({ i, b, progress }) {
    var speed = 120 + seeded(i + 0.25) * 480;
    var y = useTransform(progress, [0, 1], [speed / 2, -speed / 2]);
    var opacity = useTransform(progress, [0, 1], [0.3, 1]);
    return h(motion.div, {
      className: 'box',
      style: {
        left: (5 + seeded(i) * 85) + '%',
        top: (10 + seeded(i + 0.5) * 70) + '%',
        background: COLORS[b],
        y: y, opacity: opacity,
      },
    });
  }
  function Section({ s }) {
    var ref = React.useRef(null);
    var sp = useScroll({ target: ref, offset: ['start end', 'end start'] });
    var kids = [];
    for (var b = 0; b < PER; b++) kids.push(h(Box, { key: b, i: s * PER + b, b: b, progress: sp.scrollYProgress }));
    return h('section', { ref: ref }, kids);
  }
  function App() {
    var secs = [];
    for (var s = 0; s < SECTIONS; s++) secs.push(h(Section, { key: s, s: s }));
    return h(React.Fragment, null, secs);
  }
  createRoot(document.getElementById('root')).render(h(App));


  runBench('framer-motion (React)');
</script>
</body></html>
