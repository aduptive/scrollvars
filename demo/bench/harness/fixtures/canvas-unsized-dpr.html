<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fixture: mountEffect() applySize() feedback-loop guard (ADU-107, fifth pass)</title>
<style>
  /* CSS-sized canvas whose attribute values happen to equal its CSS size,
     the exact shape the old border-box-rect-vs-content-box-attribute
     equality guard mistook for the unsized case on first mount. .grown
     is a later, legitimate, class-driven resize: applySize() must follow
     it, not stay frozen at the first size. */
  #css-sized { width: 150px; height: 80px; }
  #css-sized.grown { width: 300px; height: 160px; }

  /* CSS-sized, fractional padding: the feedback-loop check comparing a
     bit-exact ResizeObserver contentRect against the fallback's sub-pixel
     residual (Chrome's computed padding can report the authored value, not
     the sub-pixel value layout actually used) mistook this for having
     moved too, on first mount, fifth-pass verifier finding. */
  #css-sized-fractional { width: 300px; height: 150px; padding: 0.3px; }
  #css-sized-fractional.grown { width: 400px; height: 200px; }

  /* CSS-sized under transform: scale(): getBoundingClientRect() (the
     fallback) reports the transformed, inflated box; a ResizeObserver
     entry's contentRect is layout size, unaffected by transform. Comparing
     the two read this never-moved canvas as having moved, fifth-pass
     panel finding. */
  #css-sized-scaled { width: 200px; height: 100px; transform: scale(1.3); }
  #css-sized-scaled.grown { width: 250px; height: 120px; }
</style>
</head>
<body>
<!-- Not shipped, not generated: loaded directly by
     demo/bench/harness/e2e-invariants.mjs, which injects the built
     dist/canvas/index.js itself (no <script> here on purpose).

     #unsized-border: no CSS size at all, plus a border. clientWidth
     excludes the border, the border-box rect does not, so the old
     rect-vs-attribute equality guard never fired here and the DPR
     feedback loop this ticket exists to stop ran unchecked (the false
     negative). #css-sized: attribute width/height equal to its CSS size,
     which used to trip the same guard into pinning it on first mount (the
     false positive), freezing every later stylesheet-driven resize.

     #unsized-padded: no CSS size, 10px padding. clientWidth includes
     padding (unlike border), so measureLayout() calling clientWidth itself
     the content box measured 320x170 instead of the intrinsic 300x150, got
     pinned to that, and settled on 340x190 after a second applySize() pass
     (third pass, verifier finding). #unsized-border-box: border, padding
     and box-sizing:border-box together, the same failure mode plus the
     pinned width/height needing box-sizing:content-box forced inline to
     land on the content box instead of a border-box interpretation.

     #unsized-fractional-padding: no CSS size, 0.3px padding (a percentage
     or calc() padding, or a non-100% zoom, land here just as easily).
     clientWidth/clientHeight round to an integer before computed padding
     (subpixel-precise) is subtracted, so the third-pass fix still landed a
     fraction of a pixel off the intrinsic 300x150 on its first read and
     needed a second applySize() pass to settle, at 300.4x150.4 instead of
     300x150 (fourth pass, verifier finding). getBoundingClientRect() minus
     computed border/padding did not fully close it either (Chrome's
     computed padding can report the authored value, not the sub-pixel
     value layout actually used): measureLayout() now reads the
     ResizeObserver entry's own contentRect instead, the layout engine's
     own bit-exact measurement.

     #css-sized-fractional, #css-sized-scaled: fifth pass. Once
     measureLayout() started reading the entry's contentRect, the
     feedback-loop check itself started comparing that bit-exact value
     against a fallback read, which disagrees with it for reasons that have
     nothing to do with feedback: a sub-pixel residual for fractional
     padding, or a whole scale factor for a CSS transform. Both got pinned
     on first mount and then ignored every later CSS resize. The check now
     takes both readings the same way, the fallback, once right before and
     once right after the backing-store write.

     #unsized-tiny, #unsized-tiny-20: sixth pass (panel finding). A real
     feedback loop moves an unsized canvas by size * (dpr - 1) CSS pixels
     per applySize() pass: for a small canvas at a DPR just over 1 that is
     itself only a pixel or two (4x4 at dpr 1.25, or 20x20 at dpr 1.05, both
     move by exactly 1px on the very first pass). The fifth pass's flat 1px
     tolerance needed that gap to grow PAST a pixel, so it took many passes
     to notice, pinning 50-100% inflated first. The check now compares the
     two readings by ratio instead, which scales with size and DPR (see
     src/canvas/index.ts). Loaded on their own page below at a fractional
     deviceScaleFactor.

     onDprChange()'s own sixth-pass fix (a transformed CSS-sized canvas no
     longer mis-sizing itself on a real DPR change, see src/canvas/index.ts
     and test/canvas.test.mjs) has no fixture here: Puppeteer's
     page.setViewport() cannot trigger it (see the note in
     e2e-invariants.mjs), so it is unit-tested only. -->
<canvas id="unsized-border" style="border: 4px solid red"></canvas>
<canvas id="css-sized" width="150" height="80"></canvas>
<canvas id="unsized-padded" style="padding: 10px"></canvas>
<canvas id="unsized-border-box" style="border: 4px solid blue; padding: 6px; box-sizing: border-box"></canvas>
<canvas id="unsized-fractional-padding" style="padding: 0.3px"></canvas>
<canvas id="css-sized-fractional"></canvas>
<canvas id="css-sized-scaled"></canvas>
<canvas id="unsized-tiny" width="4" height="4"></canvas>
<canvas id="unsized-tiny-20" width="20" height="20"></canvas>
</body>
</html>
