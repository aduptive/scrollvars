<script>
  // ?scoped=1: the published row for styles/scoped.css. The sheet (copied
  // next to this page by demo:sync, never hand-edited) plus the two author
  // lines its contract asks of this fixture: the boxes are the readers, and

  if (new URLSearchParams(location.search).has('scoped'))
    document.write('<link rel="stylesheet" href="scoped.css"><style>.box { --sv-t: inherit; --sv-view: inherit; } section { --sv-t: 0.5; }</style>');

<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0d1611; color: #e8efe6; font: 14px/1.5 -apple-system, sans-serif; }
  .hud { position: fixed; top: 12px; left: 12px; z-index: 9; background: rgba(0,0,0,.75);
         padding: 14px 18px; border-radius: 10px; font-family: ui-monospace, monospace;
         font-size: 13px; white-space: pre; }
  section { position: relative; height: 120vh; overflow: hidden;
            border-top: 1px solid rgba(255,255,255,.06); }
  .card { position: absolute; inset: 8px; overflow: hidden; font-size: 8px;
          line-height: 1.3; color: rgba(255,255,255,.7); }
  section .card span { display: inline-block; padding: 0 2px; }
  section .card span.t0 { color: #fff; font-weight: 600; }
  section .card span.t1 { opacity: .8; }
  section .card span.t2 { text-decoration: underline; }
  section .card span.t3 { letter-spacing: .5px; }
  section .card span.t4 { font-style: italic; }
  .box { position: absolute; width: 90px; height: 90px; border-radius: 12px;
         will-change: transform, opacity; }

  .box {
    translate: 0 calc((0.5 - var(--sv-t, 0.5)) * var(--speed));
    opacity: calc(0.3 + var(--sv-t, 0.5) * 0.7);
  }

  var Q = new URLSearchParams(location.search);
  var SECTIONS = +Q.get('s') || 30, PER = +Q.get('p') || 5, DEEP = +Q.get('deep') || 0;
  var COLORS = ['#f2c14e', '#ffb454', '#6ee7a0', '#7dd3fc', '#ff7d90'];
  function seeded(i) { return (Math.sin(i * 999) + 1) / 2; }
  var boxes = [];
  for (var s = 0; s < SECTIONS; s++) {
    var sec = document.createElement('section');
    for (var b = 0; b < PER; b++) {
      var i = s * PER + b;
      var el = document.createElement('div');
      el.className = 'box';
      el.style.left = (5 + seeded(i) * 85) + '%';
      el.style.top = (10 + seeded(i + 0.5) * 70) + '%';
      el.style.background = COLORS[b];
      var speed = 120 + seeded(i + 0.25) * 480; // px of total travel
      if (DEEP) {
        // realistic subtree under every animated box: recalc has real
        // descendants to invalidate (?deep=N controls the size)
        var card = document.createElement('div');
        card.className = 'card';
        for (var d = 0; d < DEEP; d++) {
          var sp = document.createElement('span');
          sp.className = 't' + (d % 5);
          sp.textContent = 'node ' + d;
          card.appendChild(sp);
        }
        el.appendChild(card);
      }
      sec.appendChild(el);
      boxes.push({ el: el, sec: sec, speed: speed });
    }
    document.body.appendChild(sec);
  }

  // No call in the default run: the benchmark has to measure what the library
  // actually does, and since the page outputs became self-detecting that is
  // the auto path. `?local=1` still forces them off for the local-only engine.
  if (Q.has('local')) SV.setPageOutputs(false);
  // The cost of USING the two document variables, which the default page has
  // nothing to read: this is the row that tells a reader what the feature
  // costs, now that the default detects its own consumers.
  if (Q.has('pageoutputs')) SV.setPageOutputs(true);
  var seen = new Set();
  boxes.forEach(function (b) {
    b.el.style.setProperty('--speed', b.speed + 'px');
    if (!seen.has(b.sec)) { seen.add(b.sec); SV.track(b.sec, { travel: true, view: false }); }
  });

  runBench('scrollvars');
