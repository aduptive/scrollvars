  * { box-sizing: border-box; margin: 0; }
  body { background: #0d1611; color: #e8efe6; font: 14px/1.5 -apple-system, sans-serif; }

         font-size: 13px; white-space: pre; }

         will-change: transform, opacity; }

    translate: 0 calc((0.5 - var(--sv-t, 0.5)) * var(--speed));

  var Q = new URLSearchParams(location.search);
  var SECTIONS = +Q.get('s') || 30, PER = +Q.get('p') || 5, DEEP = +Q.get('deep') || 0;
  var COLORS = ['#f2c14e', '#ffb454', '#6ee7a0', '#7dd3fc', '#ff7d90'];
  function seeded(i) { return (Math.sin(i * 999) + 1) / 2; }
  var boxes = [];
  for (var s = 0; s < SECTIONS; s++) {
    var sec = document.createElement('section');
    for (var b = 0; b < PER; b++) {
      var i = s * PER + b;
      var el = document.createElement('div');
      el.className = 'box';
      el.style.left = (5 + seeded(i) * 85) + '%';
      el.style.top = (10 + seeded(i + 0.5) * 70) + '%';
      el.style.background = COLORS[b];
      var speed = 120 + seeded(i + 0.25) * 480; // px of total travel
      if (DEEP) {
        // realistic subtree under every animated box: recalc has real
        // descendants to invalidate (?deep=N controls the size)
        var card = document.createElement('div');
        card.className = 'card';
        for (var d = 0; d < DEEP; d++) {
          var sp = document.createElement('span');
          sp.className = 't' + (d % 5);
          sp.textContent = 'node ' + d;
          card.appendChild(sp);
        }
        el.appendChild(card);
      }
      sec.appendChild(el);
      boxes.push({ el: el, sec: sec, speed: speed });
    }
    document.body.appendChild(sec);
  }

  // No call in the default run: the benchmark has to measure what the library
  // actually does, and since the page outputs became self-detecting that is
  // the auto path. `?local=1` still forces them off for the local-only engine.
  if (Q.has('local')) SV.setPageOutputs(false);
  // The cost of USING the two document variables, which the default page has
  // nothing to read: this is the row that tells a reader what the feature
  // costs, now that the default detects its own consumers.
  if (Q.has('pageoutputs')) SV.setPageOutputs(true);
  var seen = new Set();
  boxes.forEach(function (b) {
    b.el.style.setProperty('--speed', b.speed + 'px');
    if (!seen.has(b.sec)) { seen.add(b.sec); SV.track(b.sec, { travel: true, view: false }); }
  });

  runBench('scrollvars');
</script>
